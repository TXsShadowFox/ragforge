[project]
name = "ragforge"
version = "0.1.0"
description = "RAGForge: a multi-tenant RAG-as-a-Service platform (API + ingestion workers)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=10.1.0",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.108",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.108",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "testcontainers[postgres,qdrant,redis]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "shared", "worker"]

# ---------------------------------------------------------------- ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "widget"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # naming
    "UP",      # modern Python syntax
    "B",       # likely bugs
    "S",       # security (bandit)
    "ASYNC",   # async mistakes
    "C4",      # comprehensions
    "SIM",     # simpler code
    "RET",     # return statements
    "PT",      # pytest style
    "RUF",     # ruff-specific
    "FAST",    # FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # `assert` is how pytest works
    "S105",  # fake passwords in tests are fine
    "S106",
]

# ---------------------------------------------------------------- mypy ----
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["api", "shared", "worker", "tests", "eval", "loadtests"]

# -------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
# One event loop for the whole test run, so async fixtures can be shared (e.g. a DB engine).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs Docker (real Postgres, Redis, RabbitMQ, Qdrant and RustFS)",
]
