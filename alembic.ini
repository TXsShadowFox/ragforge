# Alembic settings for the command line, used to create a new migration:
#   uv run python -m alembic revision --autogenerate --rev-id 0002 -m "add documents"
# The database URL comes from DATABASE_URL in .env (see shared/db/migrations/env.py).
# The app, Docker and the tests run migrations with `python -m shared.db.migrate` instead.

[alembic]
script_location = %(here)s/shared/db/migrations
prepend_sys_path = .
path_separator = os
# Files are named like v0001_tenants_users_api_keys.py (a valid Python module name).
file_template = v%%(rev)s_%%(slug)s

[post_write_hooks]
# Clean up each new migration file with ruff (run as `python -m ruff`, see CLAUDE.md D11).
# Format first: then the lint step does not complain about long lines.
hooks = ruff_format, ruff_fix
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
