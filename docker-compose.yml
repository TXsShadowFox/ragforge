# RAGForge local stack.
#   make up    -> start everything (API + worker + dashboard + data services + monitoring)
#   make dev   -> start only the data services; run the API on your machine
#   make down  -> stop everything (data is kept in Docker volumes)
#
# Passwords come from `.env` (a copy of `.env.example`).
# The integration tests read the image versions from this file, so change them only here.

name: ragforge

# Shared by our Python services: one image for all of them (CLAUDE.md, D3).
x-ragforge-app: &ragforge-app
  build:
    context: .
    dockerfile: infra/docker/Dockerfile
  image: ragforge-app:dev
  env_file: .env
  environment:
    # Inside Docker, services find each other by service name, not localhost.
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    QDRANT_URL: http://qdrant:6333
    S3_ENDPOINT_URL: http://rustfs:9000
    MODEL_CACHE_DIR: /models
  volumes:
    - model-cache:/models  # the embedding model is downloaded once, then kept here

services:
  # ---------------------------------------------------------------- data ----
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql (not .../data).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "5672:5672"    # AMQP (the API and workers connect here)
      - "15672:15672"  # management web UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # A plain TCP check of the AMQP port (bash /dev/tcp, like Qdrant below).
      # Not `rabbitmq-diagnostics`: it runs as root, and on a slow first start it can
      # create the Erlang cookie file before RabbitMQ does. RabbitMQ then cannot read
      # the file and stops ("eacces"). It also starts a full Erlang VM on every check.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5672"]
      interval: 5s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "6333:6333"  # HTTP API + web UI at /dashboard
      - "6334:6334"  # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image has no curl, so bash sends a tiny HTTP request to /readyz.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    # S3-compatible object storage (replaces MinIO, which is no longer maintained).
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # web console
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------- monitoring ----
  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"  # 3001 on your machine; 3000 stays free for the Next.js dashboard
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------ ragforge ----
  init:
    <<: *ragforge-app
    # Prepares every store (migrations, bucket, Qdrant collection, queues), then exits.
    # The API and the worker start only after it succeeds.
    command: ["python", "-m", "shared.init"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  worker:
    <<: *ragforge-app
    # Sends outbox jobs to RabbitMQ and processes documents. About 0.35 GB of RAM when idle,
    # 0.6 GB while it embeds (with EMBEDDING_BATCH_SIZE=8).
    command: ["python", "-m", "worker"]
    depends_on:
      init:
        condition: service_completed_successfully

  api:
    <<: *ragforge-app
    # Loads the embedder and the reranker at startup (~15 s; ~0.5 GB of RAM).
    # The LLM is outside (Groq by default: LLM_API_KEY in .env).
    ports:
      - "8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    # The dashboard: http://localhost:3000. About 0.1 GB of RAM.
    build:
      context: ./frontend
    image: ragforge-frontend:dev
    environment:
      API_URL: http://api:8000  # where the dashboard's server calls the API
      PUBLIC_API_URL: http://localhost:8000  # the address browsers use (the widget's tag)
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
  qdrant-data:
  rustfs-data:
  prometheus-data:
  grafana-data:
  model-cache:
