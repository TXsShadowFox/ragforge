# Prometheus pulls ("scrapes") metrics from each target every 15 seconds.
# Web UI: http://localhost:9090  (Status -> Targets shows if the API is UP)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ragforge-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
