# Grafana connects to Prometheus (metrics) and Jaeger (traces) automatically at startup.
# The dashboards are in infra/grafana/dashboards (see ../dashboards/ragforge.yml).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
