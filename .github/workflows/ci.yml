name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.18"
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # setup-uv has no short major tags after v7 (no `@v10`), so use the full version.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run python -m ruff check .
      - run: uv run python -m ruff format --check .
      - run: uv run python -m mypy

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      # Keep the downloaded models between runs (MODEL_CACHE_DIR): the embedder (67 MB)
      # and the reranker (80 MB). A new model needs a new key.
      - uses: actions/cache@v6
        with:
          path: .cache/models
          key: models-bge-small-en-v1.5-ms-marco-minilm-l6
      # Integration tests start real containers with testcontainers (Docker is preinstalled).
      - run: uv run python -m pytest -v

  frontend:
    name: Dashboard and widget
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Only the packages the app ships; the dev tools have a known, harmless warning
      # (see CLAUDE.md, Gotchas).
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # The dashboard's helpers and the widget (in a simulated browser).
      - run: npm test
      - run: npm run build

  docker:
    name: Docker build and browser test
    runs-on: ubuntu-24.04
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.fake-llm.yml
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          $COMPOSE config --quiet
      - uses: docker/setup-buildx-action@v4
      # `load: true`: the images go to the local Docker, for the browser test below.
      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          load: true
          tags: ragforge-app:dev
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build the dashboard image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          load: true
          tags: ragforge-frontend:dev
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # The whole stack, with the fake LLM instead of Groq (no API key in CI). The API
      # and the worker download their models first (~150 MB).
      - name: Start the stack
        run: $COMPOSE up -d --no-build --wait --wait-timeout 600 api worker frontend
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Playwright serves widget/demo.html with `uv run --no-project python`.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Browser test (sign up, upload, public key, ask the widget)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Logs of the stack
        if: failure()
        run: $COMPOSE logs --tail=200
      - name: Keep the Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
